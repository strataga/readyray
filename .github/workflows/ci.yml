name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; credentials disabled below
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check application code
        run: |
          bun run lint
          bun run typecheck
          bun run build
          bun run test
      - name: Check committed changes for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi
      - name: Install pinned repository check tools
        env:
          ACTIONLINT_VERSION: 1.7.9
          ACTIONLINT_SHA256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          tools_dir="$RUNNER_TEMP/repository-check-tools"
          mkdir -p "$tools_dir"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$tools_dir" actionlint

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" \
            --output "$RUNNER_TEMP/shellcheck.tar.gz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$tools_dir" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: Check workflows and hooks
        run: |
          actionlint
          shellcheck .githooks/pre-commit
